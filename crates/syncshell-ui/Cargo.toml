[package]
name = "syncshell-ui"
version.workspace = true
edition.workspace = true

[dependencies]
alacritty_terminal = "0.24"
eframe = "0.35.0"
egui = "0.35.0"
open = { version = "5.4.0", features = ["shellexecute-on-windows"] }
syncshell-core = { path = "../syncshell-core" }
# IME 조합 중인 글자를 셀 그리드 위에 그리려면 글자별 폭(한글·한자·가나는 2셀)이
# 필요하다(DEV-012). cjk 피처는 애매한 폭(Ambiguous) 문자를 동아시아 관례대로
# 2로 치는 옵션 — 터미널이 그렇게 렌더링한다.
unicode-width = { version = "0.2", features = ["cjk"] }
fontdb = "0.23"
ttf-parser = "0.25"
# 탐색기의 수정일 컬럼 표시용(DEV-005). 이미 다른 의존성(wgpu 등)이 끌어오는
# 버전이라 새 크레이트 컴파일 비용이 사실상 없음 — 버전만 고정해 직접 의존.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# BUG-006 진단: 자가 진단(`SYNCSHELL_SELFTEST=oskeys`)이 실제 OS 키 입력(SendInput)으로
# 키 반복을 흉내 내서, OS → IME → winit → egui 경로까지 재기 위해.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }
